[project]
name = "venditus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Pins validados pela Task 0 (scripts/smoke_api.py) em 2026-08-09.
    # langgraph 1.x: interrupt/Command vivem em langgraph.types.
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-openai>=1.4.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "langgraph-cli[inmem]>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venditus"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
